databaseChangeLog:
  - changeSet:
      id: 003
      author: sistema-eventos
      changes:
        - createTable:
            tableName: inscricoes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: evento_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: participante_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: data_inscricao
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: inscricoes
            baseColumnNames: evento_id
            referencedTableName: eventos
            referencedColumnNames: id
            constraintName: fk_inscricao_evento

        - addForeignKeyConstraint:
            baseTableName: inscricoes
            baseColumnNames: participante_id
            referencedTableName: participantes
            referencedColumnNames: id
            constraintName: fk_inscricao_participante

        - addUniqueConstraint:
            tableName: inscricoes
            columnNames: evento_id, participante_id
            constraintName: uk_inscricao_evento_participante