databaseChangeLog:
  - changeSet:
      id: 001
      author: sistema-eventos
      changes:
        - createTable:
            tableName: eventos
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: nome
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: descricao
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: data_inicio
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: data_fim
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: local
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: capacidade
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false