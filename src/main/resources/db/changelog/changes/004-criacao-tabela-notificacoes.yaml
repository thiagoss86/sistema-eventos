databaseChangeLog:
  - changeSet:
      id: 004
      author: sistema-eventos
      changes:
        - createTable:
            tableName: notificacoes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: participante_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: tipo
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: mensagem
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: data
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: notificacoes
            baseColumnNames: participante_id
            referencedTableName: participantes
            referencedColumnNames: id
            constraintName: fk_notificacao_participante